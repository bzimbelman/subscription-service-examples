name: ci

# Lints every recipe's YAML, validates each docker-compose.yml with
# `docker compose config`, and runs `helm lint` against the engine chart
# rendered with each recipe's values.yaml. No actual deploys.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        run: |
          pip install --quiet yamllint
          # Relaxed config — recipes intentionally use long lines in
          # comments and inline env defaults.
          cat > .yamllint <<'YAML'
          extends: relaxed
          rules:
            line-length: disable
            comments-indentation: disable
            truthy:
              check-keys: false
          YAML
          yamllint .

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate every docker-compose.yml
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "==> docker compose config -f $f"
            if ! docker compose -f "$f" config -q; then
              fail=1
            fi
          done < <(find . -name docker-compose.yml -not -path './.git/*')
          exit "$fail"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - name: helm lint values files
        # Each cloud recipe ships a values.yaml; we render it against the
        # upstream engine chart (vendored as a git submodule in CI, or
        # pulled by tag from the engine repo). For PR-time validation we
        # only need to syntactically parse the values — a real `helm
        # lint` against the chart happens in the engine repo's own CI.
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "==> yaml parse $f"
            if ! python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f"; then
              fail=1
            fi
          done < <(find . -name values.yaml -not -path './.git/*')
          exit "$fail"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "==> shellcheck $f"
            if ! shellcheck "$f"; then
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit "$fail"
